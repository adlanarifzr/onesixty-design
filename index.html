<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneSixty: app concept screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --teal:#266B88; --teal-d:#1B5873; --teal-dd:#0E3F52;
  --teal-50:#E4EFF3; --teal-100:#CDE1E9; --on-teal-2:#D7E8EF;
  --ground:#EEF4F6; --card:#fff; --line:#D3E1E7;
  --ink:#0E3F52; --ink-2:#456673; --ink-3:#557480;
  --hivis:#FFCB45; --hivis-50:#FFF3CC;
  --green:#137247; --green-50:#DFF2E7;
  --amber:#7D5200; --amber-50:#FFF0CC;
  --red:#B3362C;
  --display:Montserrat, system-ui, sans-serif;
  --body:Roboto, system-ui, sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
::selection{background:var(--teal-100);color:var(--teal-dd)}
html{background:#DAE6EB}
body{margin:0;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* ---------- presentation board (not part of the app) ---------- */
.board-head{max-width:1760px;margin:0 auto;padding:56px 56px 8px;display:flex;align-items:center;gap:18px}
.board-head .mark{width:44px;height:46px;object-fit:contain}
.board-head h1{font:800 26px/1.1 var(--display);margin:0;letter-spacing:-.01em;color:var(--teal-dd)}
.board-head p{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.board{max-width:1760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,390px);gap:56px 44px;justify-content:center;padding:40px 56px 80px}
figure{margin:0}
figure .device{border-radius:44px;overflow:hidden;box-shadow:0 2px 4px rgba(14,63,82,.08),0 24px 48px -16px rgba(14,63,82,.28)}
figcaption{margin-top:18px;padding:0 6px}
figcaption b{display:block;font:700 15px/1.3 var(--display);color:var(--teal-dd)}
figcaption span{display:block;margin-top:4px;font-size:14px;line-height:1.45;color:var(--ink-2)}

body{overflow-x:clip}
@media (max-width:520px){
  .board-head{padding:28px 16px 0;align-items:flex-start}
  .board-head h1{font-size:21px}
  .board{padding:24px 12px 48px;grid-template-columns:minmax(0,1fr);justify-items:center;gap:40px}
  figure{zoom:.86}
}
/* ---------- phone shell ---------- */
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
.status{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font:600 16px var(--body);color:var(--ink);position:relative;z-index:5}
.status.light{color:#fff}
.status .sys{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:20}
.home-ind.light{background:#fff}
.scroll{flex:1;overflow:hidden;position:relative}

/* app bar */
.appbar{height:52px;flex:none;display:flex;align-items:center;padding:0 8px;gap:4px;background:var(--card);border-bottom:1px solid var(--line)}
.appbar h2{flex:1;margin:0;text-align:center;font:700 17px var(--display);color:var(--teal-dd)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:var(--teal-dd);background:none;border:0}
.appbar .spacer{width:44px}

/* tab bar */
.tabbar{flex:none;height:86px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 0;position:relative;z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--body);color:var(--ink-3);padding-top:4px}
.tab.on{color:var(--teal)}
.tab.on b{font-weight:700}
.tab b{font-weight:500}
.tab.on .pill{background:var(--teal-50)}
.tab .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.cta{margin-top:-24px}
.tab.cta .fab{width:60px;height:60px;border-radius:30px;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 2px 3px rgba(14,63,82,.2),0 10px 20px -6px rgba(38,107,136,.55);border:4px solid var(--card)}
.tab.cta b{color:var(--teal-dd);font-weight:700}

/* shared bits */
.h-sec{font:700 16px var(--display);color:var(--teal-dd);margin:0;letter-spacing:-.005em}
.row{display:flex;align-items:center}
.muted{color:var(--ink-2)}
.btn{height:52px;border-radius:14px;border:0;display:flex;align-items:center;justify-content:center;gap:10px;font:700 15px var(--display);letter-spacing:.01em}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 1px 2px rgba(14,63,82,.2),0 8px 16px -8px rgba(38,107,136,.6)}
.btn.secondary{background:var(--card);color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal)}
.field{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 14px 10px;display:flex;align-items:center;gap:10px}
.field .lbl{display:block;font:500 12px var(--body);color:var(--ink-2);margin-bottom:2px}
.field .val{font:400 16px var(--body);color:var(--ink)}
.field.focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(38,107,136,.16)}
.chip{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:6px;font:500 14px var(--body);background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap}
.chip.on{background:var(--teal);color:#fff;box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--teal-50);border-radius:12px;padding:3px}
.seg span{height:38px;display:grid;place-items:center;border-radius:10px;font:500 14px var(--body);color:var(--ink-2)}
.seg span.on{background:var(--card);color:var(--teal-dd);font-weight:700;box-shadow:0 1px 3px rgba(14,63,82,.16)}
.avatar{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font:700 14px var(--display);color:#fff;flex:none}
.a1{background:#266B88}.a2{background:#8C5A2B}.a3{background:#5D6B2E}.a4{background:#7A3F63}.a5{background:#2F5D8C}.a6{background:#A24B3A}.a7{background:#3E7466}.a8{background:#55606B}
.scene,.map{display:block;width:100%;height:100%}
.thumb{border-radius:10px;overflow:hidden;flex:none}

/* ID card: the signature */
.idcard{background:var(--card);border-radius:18px;position:relative;box-shadow:0 1px 2px rgba(14,63,82,.1),0 18px 32px -18px rgba(14,63,82,.45)}
.idcard .slot{position:absolute;top:10px;left:50%;width:44px;height:8px;margin-left:-22px;border-radius:4px;background:var(--ground)}
.board-scroll .idcard .slot{left:auto;right:72px;margin-left:0}
.strap{position:absolute;left:50%;width:28px;margin-left:-14px;background:var(--teal-dd);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding-top:6px}
.strap i{font:800 8px var(--display);color:rgba(255,255,255,.72);letter-spacing:.18em;writing-mode:vertical-rl;font-style:normal}
.clip{position:absolute;left:50%;width:22px;height:20px;margin-left:-11px;border-radius:4px 4px 8px 8px;background:#082C3A}
.state{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:12px;font:700 12px var(--body);letter-spacing:.02em}
.state.ok{background:var(--green-50);color:var(--green)}
.state.ok::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--green)}
.state.wait{background:var(--amber-50);color:var(--amber)}
.state.sent{background:var(--teal-50);color:var(--teal-dd)}

/* ===== 1. Login ===== */
.login{background:var(--teal)}
.login .lockup{display:flex;align-items:center;gap:16px;margin:84px 0 0 36px}
.login .lockup .m{width:78px;height:82px;object-fit:contain}
.login .lockup .w{font:700 34px/0.98 var(--display);color:#fff;letter-spacing:.03em}
.login .tag{margin:22px 36px 0;font:400 17px/1.45 var(--body);color:var(--on-teal-2);max-width:280px}
.login .idcard{margin:40px 20px 0;padding:26px 22px 22px}
.login .forgotrow{text-align:right;margin-top:12px}
.login .idcard h2{margin:0 0 18px;font:700 22px var(--display);color:var(--teal-dd)}
.login .field+.field{margin-top:12px}
.login .opts{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 18px;padding-top:14px;border-top:1px solid var(--line)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--teal);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.link{color:var(--teal);font:500 15px var(--body);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.login .foot{margin:auto 0 44px;text-align:center;font:400 14px var(--body);color:var(--on-teal-2)}
.login .foot u{color:#fff;text-underline-offset:3px}

/* ===== 2. Forgot ===== */
.forgot{background:var(--card)}
.forgot .appbar{border-bottom:0}
.forgot .body{padding:20px 24px 0}
.forgot .badge{width:64px;height:64px;border-radius:20px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center}
.forgot h2{font:800 28px/1.15 var(--display);color:var(--teal-dd);margin:12px 0 10px;letter-spacing:-.01em}
.forgot p{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.forgot .field{margin-top:28px}
.forgot .btn{margin-top:16px}
.notice{margin-top:24px;background:var(--green-50);border-radius:14px;padding:16px;display:flex;gap:12px;color:var(--green)}
.notice b{display:block;font:700 15px var(--body);color:#0D5434;margin-bottom:3px}
.notice span{font-size:14px;line-height:1.45;color:#1D5A3D}
.forgot .resend{margin-top:20px;font-size:14px;color:var(--ink-2);text-align:center}
.forgot .back{margin:auto 24px 48px;text-align:center}

/* ===== 3. Board ===== */
.boardhead{background:var(--teal);height:268px;flex:none;position:relative}
.boardhead .top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px 0 22px;position:relative;z-index:2}
.boardhead h2{margin:0;font:800 27px/1.1 var(--display);color:#fff;letter-spacing:-.01em}
.boardhead .date{margin-top:6px;font:400 15px var(--body);color:var(--on-teal-2)}
.boardhead .bell{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;position:relative}
.boardhead .bell::after{content:"";position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:5px;background:var(--hivis);box-shadow:0 0 0 2px var(--teal)}
.board-scroll{flex:1;min-height:0;overflow:visible;position:relative;margin-top:-112px;padding:0 16px}
.board-scroll .strap{top:-156px;height:172px;padding-top:70px;left:auto;right:96px;margin-left:0;z-index:1}
.board-scroll .clip{top:2px;left:auto;right:99px;margin-left:0;z-index:3}
.board-scroll .idcard{margin-top:12px;padding:28px 16px 0;z-index:2}
.cardmain{display:flex;gap:14px}
.cardmain .thumb{width:84px;height:96px}
.cardmain h3{margin:4px 0 2px;font:700 19px/1.2 var(--display);color:var(--teal-dd)}
.cardmain .sub{font-size:14px;color:var(--ink-2)}
.cardmain .meta{display:flex;gap:6px;align-items:center;margin-top:8px;font:500 13px var(--body);color:var(--green)}
.cardacts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:14px -16px 0}
.cardacts span{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 14px var(--display);color:var(--teal)}
.cardacts span+span{border-left:1px solid var(--line)}
.week{margin-top:22px}
.week .head{display:flex;justify-content:space-between;align-items:baseline}
.week .head a{font:500 14px var(--body);color:var(--teal)}
.weekpanel{margin-top:10px;background:var(--card);border-radius:var(--r);padding:16px 16px 14px;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.figs{display:flex;align-items:flex-end;gap:22px}
.figs .big{font:800 44px/0.9 var(--display);color:var(--teal-dd);letter-spacing:-.02em}
.figs .big small{font:600 15px var(--display);letter-spacing:0;margin-left:6px;color:var(--ink-2)}
.figs .alt{padding-bottom:3px;font:400 14px var(--body);color:var(--ink-2)}
.figs .alt b{display:block;font:700 20px var(--display);color:var(--teal-dd)}
.target{margin-top:14px}
.track{height:10px;border-radius:5px;background:var(--teal-50);position:relative;overflow:visible}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--teal)}
.target p{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.target p b{color:var(--teal-dd)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px;align-items:end;height:66px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font:500 11px var(--body);color:var(--ink-3)}
.day .bar{width:100%;border-radius:5px;background:var(--teal-100);position:relative}
.day .bar em{position:absolute;top:-17px;left:0;right:0;text-align:center;font:700 11px var(--display);color:var(--teal-dd);font-style:normal}
.day.today{color:var(--teal-dd);font-weight:700}
.day.today .bar{background:var(--teal)}
.day.future .bar{height:6px;background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.post-row{margin-top:12px;background:var(--card);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center}
.post-row .thumb{width:52px;height:52px}
.post-row b{display:block;font:700 15px var(--display);color:var(--teal-dd)}
.post-row span{font-size:13px;color:var(--ink-2)}

.idcard.off{padding-bottom:16px}
.thumb.empty{width:84px;height:96px;border-radius:10px;border:1.5px dashed #9DBBC7;color:var(--teal);display:grid;place-items:center;background:var(--teal-50)}
.cardmain .meta.idle{color:var(--ink-2);align-items:flex-start;line-height:1.35}
.idle-dot{width:8px;height:8px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--ink-3);flex:none;margin-top:4px}
.checkin-now{margin-top:14px}
.needcheck{display:flex;gap:8px;align-items:flex-start;margin:14px 2px 0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.needcheck .ic{margin-top:1px;color:var(--teal)}

.news-strip{margin-top:10px;background:var(--card);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.news-strip .ico{width:40px;height:40px;border-radius:20px;background:var(--hivis);color:#3D2C00;display:grid;place-items:center;flex:none}
.news-strip b{display:block;font:700 14px var(--display);color:var(--teal-dd)}
.news-strip span{font-size:13px;color:var(--ink-2)}
.news-strip .chev{margin-left:auto;color:var(--ink-3)}
.news-strip+.week{margin-top:12px}
.news-filter{padding:2px 0 12px}
.newslist{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.news{display:flex;gap:12px;padding:14px}
.news+.news{border-top:1px solid var(--line)}
.news.unread{background:#F6FAFB}
.nav{width:40px;height:40px;border-radius:20px;flex:none}
.nav.hq{background:var(--teal);display:grid;place-items:center}
.nav.hq img{width:22px;height:23px;object-fit:contain}
.nb{min-width:0;flex:1}
.nt{display:flex;align-items:flex-start;gap:8px}
.nt b{flex:1;font:700 15px/1.3 var(--display);color:var(--teal-dd)}
.news:not(.unread) .nt b{font-weight:600}
.udot{width:10px;height:10px;border-radius:5px;background:var(--teal);flex:none;margin-top:5px}
.news p{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.pintag{display:inline-flex;align-items:center;gap:3px;font:700 11px var(--body);color:#5C4300;background:var(--hivis-50);padding:2px 7px;border-radius:8px}

/* ===== Board announcement options ===== */
.variants{max-width:1760px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,390px);gap:56px 44px;justify-content:center;padding:0 56px 80px}
.v-hnote .boardhead{height:300px}
.v-hnote .board-scroll .strap{top:-188px;height:204px;padding-top:70px}
.hnote{margin-top:16px;max-width:232px;display:flex;flex-direction:column;gap:3px}
.hfrom{display:flex;align-items:center;gap:6px;font:500 13px var(--body);color:var(--on-teal-2)}
.hdot{width:8px;height:8px;border-radius:4px;background:var(--hivis);flex:none}
.hnote b{display:flex;align-items:center;gap:2px;font:700 16px/1.3 var(--display);color:#fff}
.notice-card{margin-top:12px;background:var(--hivis-50);border-radius:var(--r);padding:12px 14px 12px}
.nc-top{display:flex;justify-content:space-between;align-items:center}
.nc-top .pintag{background:var(--hivis)}
.nc-x{width:32px;height:32px;margin:-6px -8px -6px 0;display:grid;place-items:center;color:#5C4300}
.notice-card b{display:block;margin-top:6px;font:700 16px/1.3 var(--display);color:#3D2C00}
.notice-card p{margin:3px 0 0;font-size:14px;line-height:1.4;color:#5C4300}
.nc-more{display:flex;align-items:center;gap:2px;margin-top:8px;font:700 13px var(--body);color:var(--teal-dd)}
.notice-card+.week{margin-top:14px}

/* ===== 4. Check-in ===== */
.checkin .mapwrap{position:absolute;inset:0 0 auto 0;height:340px}
.checkin .status{background:none}
.floatbar{position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.floatbar .iconbtn{background:var(--card);box-shadow:0 2px 8px rgba(14,63,82,.18)}
.floatbar .title{height:40px;padding:0 16px;border-radius:20px;background:var(--card);display:flex;align-items:center;font:700 15px var(--display);color:var(--teal-dd);box-shadow:0 2px 8px rgba(14,63,82,.18)}
.pin{position:absolute;left:148px;top:150px;width:52px;height:64px;z-index:3}
.pin .head{width:52px;height:52px;border-radius:26px 26px 26px 4px;transform:rotate(-45deg);background:var(--teal);box-shadow:0 6px 14px -4px rgba(14,63,82,.5);display:grid;place-items:center}
.pin .head img{transform:rotate(45deg);width:26px;height:27px;object-fit:contain}
.sheet{position:absolute;left:0;right:0;top:296px;bottom:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px -8px rgba(14,63,82,.25);padding:10px 20px 0;z-index:4}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.place{display:flex;gap:12px;align-items:flex-start}
.place .ico{width:44px;height:44px;border-radius:12px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;flex:none}
.place h2{margin:0;font:800 21px/1.15 var(--display);color:var(--teal-dd)}
.place p{margin:3px 0 0;font-size:14px;color:var(--ink-2);line-height:1.35}
.gps{margin-top:12px;display:flex;align-items:center;gap:8px;font:500 13px var(--body);color:var(--green);background:var(--green-50);border-radius:10px;padding:8px 10px}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.lab b{font:700 14px var(--display);color:var(--teal-dd)}
.lab span{font-size:13px;color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow:hidden}
.photos{display:flex;gap:10px}
.photos .thumb{width:88px;height:88px;position:relative}
.addtile{width:88px;height:88px;border-radius:10px;border:1.5px dashed #9DBBC7;color:var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 12px var(--body);flex:none}
.note{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.4;color:var(--ink)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:var(--card);border-top:1px solid var(--line);z-index:6}
.dock .btn{width:100%}
.dock .btn small{font:500 13px var(--body);opacity:.85;letter-spacing:0}

/* ===== 5/6. Composer ===== */
.stamp{display:flex;align-items:center;gap:6px;margin:2px 2px 0;font:500 13px var(--body);color:var(--ink-2)}
.recent{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.recent .rlab{font:500 12px var(--body);color:var(--ink-2);flex:none}
.recent .chip{height:32px;padding:0 12px;font-size:13px}
.recnote{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--ink-2)}

.compose .scroll{padding:14px 16px 0}
.linkcard{background:var(--card);border-radius:var(--r);padding:12px 12px 12px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.linkcard .ico{width:40px;height:40px;border-radius:20px;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.linkcard small{display:block;font:500 12px var(--body);color:var(--ink-2)}
.linkcard b{font:700 14px var(--display);color:var(--teal-dd)}
.linkcard .chg{margin-left:auto;font:500 14px var(--body);color:var(--teal)}
.panel{background:var(--card);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.panel .lab{margin-top:0}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--teal);padding-bottom:6px}
.amount span{font:700 18px var(--display);color:var(--ink-2)}
.amount b{font:800 36px var(--display);color:var(--teal-dd);letter-spacing:-.02em}
.amount em{margin-left:auto;font:500 14px var(--body);color:var(--ink-2);font-style:normal}
.quick{display:flex;gap:8px;margin:12px 0 14px}
.quick .chip{flex:1;justify-content:center;padding:0}
.grid2{display:grid;grid-template-columns:1fr 92px;gap:10px}
.grid2 .field,.panel .field{border-color:var(--line)}
.panel .field+.field,.panel .grid2+.field{margin-top:10px}
.panel .grid2 .field+.field{margin-top:0}
.video .playic{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.video .playic span{width:34px;height:34px;border-radius:17px;background:rgba(14,63,82,.7);display:grid;place-items:center}
.video .dur{position:absolute;right:6px;bottom:6px;font:700 11px var(--body);color:#fff;background:rgba(14,63,82,.75);padding:2px 6px;border-radius:6px}
.compose .dock{padding-top:10px}
.quotebox{position:relative;border:1.5px solid var(--teal);border-radius:12px;padding:30px 14px 12px;box-shadow:0 0 0 3px rgba(38,107,136,.14)}
.quotebox .qm{position:absolute;top:8px;left:12px;color:var(--teal)}
.quotebox p{margin:0;font:400 17px/1.45 var(--body);color:var(--ink)}
.quotebox p i{display:inline-block;width:2px;height:19px;background:var(--teal);vertical-align:-3px;margin-left:1px}
.quotebox small{display:block;text-align:right;font-size:12px;color:var(--ink-3);margin-top:6px}

.mediagrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:78px;gap:8px}
.mediagrid .thumb{width:auto;height:auto;position:relative}
.mediagrid .big{grid-column:span 2;grid-row:span 2}
.mediagrid .addtile{width:auto;height:auto;font-size:12px;gap:2px}
.mediagrid .up{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.45)}
.mediagrid .up i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff}
.mediagrid .big .dur{bottom:18px}
.upnote{margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.avatar.mini{width:26px;height:26px;border-radius:13px;font-size:11px;margin-left:-8px;box-shadow:0 0 0 2px #fff}
.tagrow .chip.on{padding-left:14px}

/* ===== 7. Team feed ===== */
.teamhead{background:var(--teal);flex:none;padding:6px 0 14px}
.teamhead .t{padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end}
.teamhead h2{margin:0;font:800 27px var(--display);color:#fff}
.teamhead p{margin:4px 0 0;font-size:14px;color:var(--on-teal-2)}
.teamhead .chips{padding:14px 20px 0}
.teamhead .chip{background:var(--teal-d);color:#fff;box-shadow:none}
.teamhead .chip.on{background:#fff;color:var(--teal-dd);font-weight:700}
.outnow{display:flex;gap:10px;padding:14px 16px 4px;overflow:hidden}
.outnow .p{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;flex:none;font:500 11px/1.2 var(--body);color:var(--ink-2);text-align:center}
.outnow .avatar{width:48px;height:48px;border-radius:24px;box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--green)}
.feed{padding:10px 16px 0}
.post{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.post+.post{margin-top:12px}
.post .who{display:flex;gap:10px;align-items:center;padding:12px 14px 0}
.post .who b{display:block;font:700 15px var(--display);color:var(--teal-dd)}
.post .who div span{font-size:13px;color:var(--ink-2)}
.post .kind{margin-left:auto;font:700 12px var(--body);color:var(--teal);background:var(--teal-50);height:22px;padding:0 8px;border-radius:11px;display:flex;align-items:center}
.post .amt{padding:10px 14px 0;display:flex;align-items:baseline;gap:8px}
.post .amt b{font:800 26px var(--display);color:var(--teal-dd);letter-spacing:-.01em}
.post .amt span{font-size:14px;color:var(--ink-2)}
.post .media{height:112px;margin:10px 14px 0;border-radius:12px;overflow:hidden}
.post .foot{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 12px}
.post .loc{display:flex;align-items:center;gap:6px;font:500 13px var(--body);color:var(--ink-2)}
.cheer{height:34px;padding:0 12px;border-radius:17px;display:flex;align-items:center;gap:6px;font:700 13px var(--body);color:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal-100)}
.cheer.on{background:var(--teal);color:#fff;box-shadow:none}
.miniid{margin:26px 14px 0;box-shadow:0 1px 2px rgba(14,63,82,.08),0 10px 18px -12px rgba(14,63,82,.4);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 12px 12px;display:flex;gap:12px;align-items:center;position:relative}
.miniid .stub{position:absolute;top:-24px;left:50%;width:18px;height:28px;margin-left:-9px;background:var(--teal-dd);border-radius:2px}
.miniid .mclip{position:absolute;top:-6px;left:50%;width:16px;height:13px;margin-left:-8px;border-radius:3px 3px 6px 6px;background:#082C3A}
.miniid .slot{position:absolute;top:7px;left:50%;width:34px;height:6px;margin-left:-17px;border-radius:3px;background:var(--ground)}
.miniid .thumb{width:64px;height:64px}
.miniid b{display:block;font:700 16px var(--display);color:var(--teal-dd)}
.miniid span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.miniid span.slot{margin:0 0 0 -17px}
.miniid em{display:flex;align-items:center;gap:6px;margin-top:6px;font:500 13px var(--body);color:var(--green);font-style:normal}
.live{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--green);flex:none}
.post .minimap{height:86px;margin:10px 14px 0;border-radius:12px;overflow:hidden;position:relative}
.post .minimap .dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:8px;background:var(--teal);box-shadow:0 0 0 3px #fff}

/* ===== 8. Ranks ===== */
.rankhead{background:var(--teal);flex:none;padding:6px 20px 18px}
.rankhead h2{margin:0;font:800 27px var(--display);color:#fff}
.rankhead p{margin:4px 0 14px;font-size:14px;color:var(--on-teal-2)}
.rankhead .seg{background:var(--teal-d)}
.rankhead .seg span{color:#fff}
.rankhead .seg span.on{background:#fff;color:var(--teal-dd)}
.rankmeta{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
.rankmeta b{font:700 14px var(--display);color:var(--teal-dd)}
.rankmeta span{display:flex;align-items:center;gap:4px;font:500 14px var(--body);color:var(--teal)}
.ranks{margin:0 16px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(14,63,82,.06)}
.rk{display:grid;grid-template-columns:34px 40px 1fr auto;gap:12px;align-items:center;padding:10px 14px;height:62px}
.rk+.rk{border-top:1px solid var(--line)}
.rk .n{font:800 20px var(--display);color:var(--teal-dd);text-align:center}
.rk .nm b{display:block;font:700 15px var(--display);color:var(--teal-dd)}
.rk .nm > span{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-3)}
.rk .mv i{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-weight:500;margin-right:6px}
.rk .mv i.up{color:var(--green)}
.rk .mv i.down,.rk .mv i.same{color:var(--ink-2)}
.rk .sc{text-align:right}
.rk .sc b{display:block;font:800 19px var(--display);color:var(--teal-dd)}
.rk .sc span{font-size:12px;color:var(--ink-3)}
.rk.lead .n{color:#fff;background:var(--teal);border-radius:10px;height:34px;display:grid;place-items:center}
.rk.me{background:var(--hivis-50)}
.you{font:700 11px var(--body);background:var(--hivis);color:#4A3500;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.pinned{position:absolute;left:12px;right:12px;bottom:96px;background:var(--teal-dd);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 24px -10px rgba(14,63,82,.6);z-index:8}
.pinned .n{font:800 22px var(--display);color:var(--hivis);width:40px;text-align:center}
.pinned b{display:block;font:700 15px var(--display)}
.pinned span{font-size:13px;color:var(--on-teal-2)}
.pinned .gap{margin-left:auto;text-align:right}
.pinned .gap b{font:800 20px var(--display);color:var(--hivis)}
</style>
</head>
